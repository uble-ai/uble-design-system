<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
/* UBLE Design System — generated from tokens.json */
:root, [data-theme="dark"] {
  --bg: #07090c; /* Fundo de pagina. Escuro: nunca preto puro. Claro: o canvas quente da marca, nunca branco puro. */
  --surface: #151a21; /* Cards, paineis, cabecalho de tabela. Base solida de todo vidro (`glass-*`). */
  --surface-2: #192227; /* Segunda elevacao: dropdowns, dock, modais. Escuro: o ardosia original do designer (2024). */
  --line: rgba(239,238,235,0.10); /* Bordas e divisores. Unica linha do sistema; nunca borda solida clara. */
  --line-strong: rgba(239,238,235,0.20); /* Borda de campo em foco/hover e divisor de secao. */
  --text: #efeeeb; /* Texto principal sobre `bg`, `surface` e `surface-2`. 17:1 escuro, 15:1 claro. */
  --text-soft: #bfc4cb; /* Texto secundario, lede, celulas de tabela. Minimo 9:1 em todo fundo. */
  --text-muted: #7d848e; /* Rotulos, notas, eixos, legendas. 5,3:1 sobre `bg`, 4,6:1 sobre `surface` (escuro); 4,7:1 (claro). */
  --text-dim: #4a515b; /* SO decorativo (`aria-hidden`): numeros de secao nao visitados, linhas-base de diagramas. Reprova como texto. */
  --flamingo: #fd542d; /* Flamingo, a cor da UBLE (#FD542D, o mesmo do avatar oficial). Luz, nunca tinta: numero-chave, estado ativo, UM destaque por tela. Nunca bloco grande de fundo, exceto capa de social. */
  --flamingo-text: #fd542d; /* Flamingo como TEXTO e link. Escuro: 6,2:1 sobre `bg`. Claro: tom escurecido, 5,1:1 sobre `bg`; o #FD542D puro da 2,8:1 no claro e e proibido como texto. */
  --flamingo-soft: #ff9a6b; /* Ponto medio do gradiente de texto do hero (`flamingo` -> `flamingo-soft` -> `shark`). So no h1 da capa. */
  --flamingo-tint: rgba(253,84,45,0.14); /* Fundo de item ativo, chip selecionado, destaque de linha. Sempre com `flamingo-text` por cima. */
  --on-flamingo: #07090c; /* Texto sobre preenchimento `flamingo`: sempre tinta escura (6,2:1). Branco sobre Flamingo da 2,8:1 e so vale no wordmark do avatar. */
  --shark: #6c99a4; /* Shark, cor secundaria. Semantica fixa nos graficos: a perda e o que NAO e UBLE. Rotulos de grupo no dock. */
  --shark-text: #6c99a4; /* Shark como texto. Escuro 6,4:1 sobre `bg`; claro 5,5:1. */
  --shark-tint: rgba(108,153,164,0.16); /* Fundo de serie Shark em legendas e chips. */
  --success: #2bd46b; /* SO indicador de status (ponto online, OK). Nunca para valor financeiro: recuperado e sempre `flamingo`. */
  --danger: #ff6b6b; /* Erro de formulario e alerta. Nao e a cor de perda nos graficos (essa e `shark`). */
  --warning: #f7b733; /* Aviso. Raro; prefira texto a cor. */
  --glass-card: rgba(21,26,33,0.55); /* Fundo de card de vidro, com `blur-glass`. Equivalente estatico: `surface` + `line`. */
  --glass-panel: rgba(21,26,33,0.90); /* Dropdown, dock expandido, modal. Com `blur-panel`. */
  --glass-nav: rgba(7,9,12,0.62); /* Barra superior apos rolagem (8px). Com `blur-glass`. */
  --hover-tint: rgba(239,238,235,0.06); /* Hover de item de menu, linha de tabela, pager. */
  --aurora-flamingo: rgba(253,84,45,0.55); /* Mancha de aurora superior-esquerda (`blur-aurora`). Claro: metade da opacidade. */
  --aurora-shark: rgba(108,153,164,0.45); /* Mancha de aurora direita. */
  --focus: #fd542d; /* Anel de foco: 2px solido, offset 3px. 6,2:1 escuro e 5,1:1 claro sobre `bg`. */
  --shadow-panel: 0 30px 80px -20px rgba(0,0,0,0.70); /* Dropdown e modal. */
  --shadow-dock: 0 20px 60px -30px rgba(0,0,0,0.80); /* Dock lateral. */
  --glow-flamingo: 0 10px 30px -8px rgba(253,84,45,0.60); /* Hover do CTA principal e do ponto ativo. Unico brilho do sistema. */
}

:root {
  --space-1: 4px; /* Gap entre icone e rotulo; padding vertical de tag. */
  --space-2: 8px; /* Gap de pilulas em menu; margem entre numero e rotulo em stat. */
  --space-3: 12px; /* Padding horizontal de eyebrow e de item de dropdown; celula de tabela (12x8). */
  --space-4: 16px; /* Gap de grid de cards (14-16px); padding de botao (9x16); gutter mobile. */
  --space-5: 20px; /* Padding de card compacto. */
  --space-6: 24px; /* Margem acima de tabela e ledger; padding de card de documento. */
  --space-7: 28px; /* Padding de card padrao (26-28px); gutter desktop; margem acima de callout. */
  --space-8: 32px; /* Separacao entre blocos de conteudo em documento. */
  --space-11: 44px; /* Margem acima de grids de cards; alvo minimo de toque. */
  --space-14: 56px; /* Margem acima de stat row / bento. */
  --space-18: 72px; /* Passo da grade de fundo (`Aurora`); ritmo entre secoes de site. */
  --space-22: 88px; /* Margem acima do pager; respiro de secao de landing. */

  --radius-md: 12px; /* Item de dropdown, campo de formulario. */

  --radius-xl: 18px; /* Dropdown, dock, painel de vidro. */
  --radius-2xl: 20px; /* Card padrao, card de documento, bento. */
  --radius-pill: 999px; /* Eyebrow, tag, botao, chip de filtro, gatilho de menu. */
  --blur-glass: 18px; /* Cards, barra superior, dock (com saturate(140%)). */
  --blur-panel: 22px; /* Dropdown e modal (com saturate(150%)). */
  --blur-aurora: 90px; /* Manchas de aurora no fundo. */
  --duration-fast: 160ms; /* Fechar dropdown, hover de cor. */
  --duration-base: 250ms; /* Hover de fundo, chip, abrir dropdown (220-280ms). */
  --duration-exit: 320ms; /* Saida de pagina: opacity 0, blur 8px, translateY(-10px). */
  --duration-dock: 450ms; /* Largura do dock e padding do conteudo quando fixado. */
  --duration-enter: 700ms; /* Entrada de pagina: de opacity 0, blur 10px, translateY(18px). */
  --duration-reveal: 800ms; /* Revelacao escalonada de blocos (stagger de 60ms, comecando em 100ms). */
  --duration-aurora: 26s; /* Deriva de uma mancha de aurora (22 a 44s, alternate). */
  --ease-uble: cubic-bezier(0.2, 0.7, 0.2, 1); /* A unica curva do sistema. Entrada rapida, pouso longo. */
  --ease-linear: linear; /* So para tracos de SVG sendo desenhados (stroke-dashoffset). */
  --opacity-grid: 0.55; /* Grade de 72px sobre o fundo escuro (0.35 no claro), mascarada por radial. */
  --opacity-aurora: 0.55; /* Mancha de aurora no escuro; 0.3 no claro. */
  --opacity-disabled: 0.45; /* Controles desabilitados. */
  --font-display: "Archivo Black", "Archivo", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --text-display-xl: 400 88px/0.98 var(--font-display); /* h1 de capa e hero. clamp(40px, 6.4vw, 88px). Max 15ch por linha. */
  --text-display-l: 400 58px/1.02 var(--font-display); /* h2 de secao em site e deck. clamp(32px, 4.4vw, 58px). Max 20ch. */
  --text-display-m: 400 40px/1.05 var(--font-display); /* Titulo de slide, de proposta e de relatorio (claro). Max 28ch. */
  --text-display-s: 400 26px/1.1 var(--font-display); /* h3 de secao. Dentro de card, use `heading` no lugar. */
  --text-wordmark: 400 128px/1 var(--font-display); /* SO para o nome da empresa quando o SVG nao couber (favicon tipografico, assinatura). Prefira sempre o asset `uble-wordmark-*.svg`. */
  --text-heading: 600 20px/1.2 var(--font-body); /* Titulo de card, de coluna de bento, de item de dropdown (14px/600 nesse caso). */
  --text-dek: 400 22px/1.45 var(--font-body); /* Subtitulo logo abaixo do display. `text`, nao `text-soft`. Max 52ch. */
  --text-lede: 400 17px/1.6 var(--font-body); /* Primeiro paragrafo de uma secao, em `text-soft`; negrito em `text`. Max 62ch. */
  --text-body: 400 16px/1.6 var(--font-body); /* Padrao de documento. 15px em interfaces densas. Max 70ch. */
  --text-body-s: 400 14px/1.5 var(--font-body); /* Rotulo abaixo de numero grande (`text-soft`), celula de tabela, item de menu. */
  --text-caption: 400 13px/1.5 var(--font-body); /* Nota de rodape, fonte de dado, aviso legal. `text-muted`. */
  --text-button: 600 14px/1 var(--font-body); /* Rotulo de botao e CTA. Nunca caixa alta. */
  --text-num-xl: 500 40px/1.1 var(--font-mono); /* Numero-chave em stat/bento. clamp(28px, 3vw, 40px). Em `text`; em `flamingo` quando for o que a UBLE recuperou. */
  --text-num-l: 500 28px/1.1 var(--font-mono); /* Numero em card menor e em slide de deck. */
  --text-eyebrow: 500 12px/1 var(--font-mono); /* Caixa alta. Dentro da pilula `Eyebrow`; o numero em `flamingo-text`, o texto em `text-soft`. */
  --text-label: 500 11px/1 var(--font-mono); /* Caixa alta. Cabecalho de tabela, legenda de eixo, grupo do dock (`shark-text`), tag. */
  --text-data: 400 13.5px/1.5 var(--font-mono); /* Celula numerica, ledger, callout tecnico. `font-variant-numeric: tabular-nums` sempre. */
  --text-code: 400 13px/1.55 var(--font-mono); /* Trechos de codigo, endpoint, ID de transacao. */
}

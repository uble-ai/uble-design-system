<!-- @dsCard group="Texto" height=140 subtitle="Tag, chip de filtro e status" -->
<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<link rel="stylesheet" href="../tokens/tokens.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  body { padding: 24px; font-size: 15px; line-height: 1.5; }
  *, *::before, *::after { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: var(--radius-xs); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--glass-card); font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-soft); }
  .eyebrow b { color: var(--flamingo-text); font-weight: 500; }
  .card { position: relative; padding: var(--space-7); border-radius: var(--radius-2xl); background: var(--glass-card); backdrop-filter: blur(var(--blur-glass)); -webkit-backdrop-filter: blur(var(--blur-glass)); overflow: hidden; isolation: isolate; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(140deg, rgba(253,84,45,0.55), rgba(239,238,235,0.08) 40%, rgba(108,153,164,0.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  [data-theme="light"] .card::before { background: linear-gradient(140deg, rgba(253,84,45,0.55), rgba(16,22,31,0.10) 40%, rgba(108,153,164,0.45)); }
  .card.static { background: var(--surface); backdrop-filter: none; border: 1px solid var(--line-strong); }
  .card.static::before { display: none; }
  .k { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; color: var(--text); display: block; }
  .k.flam { color: var(--flamingo-text); }
  .l { color: var(--text-soft); font-size: 14px; margin-top: 8px; }
  .l b { color: var(--text); font-weight: 600; }
  .label { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  .note { font-size: 13px; color: var(--text-muted); margin-top: 16px; }
</style>
</head>
<body>

<style>
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: var(--radius-pill); font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-soft); background: transparent; }
  .tag.flam { color: var(--flamingo-text); border-color: rgba(253,84,45,0.4); }
  .tag.shark { color: var(--shark-text); border-color: rgba(108,153,164,0.45); }
  .chip { display: inline-flex; align-items: center; padding: 6px 14px; border: 1px solid var(--line); border-radius: var(--radius-pill); font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-soft); cursor: pointer; transition: all var(--duration-base) var(--ease-uble); background: transparent; }
  .chip:hover { border-color: rgba(253,84,45,0.5); }
  .chip[aria-pressed="true"] { border-color: var(--flamingo); color: var(--text); background: var(--flamingo-tint); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-soft); }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); }
</style>
<div class="row" style="margin-bottom:14px">
  <span class="tag">PDF</span><span class="tag">Google Sheets</span><span class="tag flam">Recuperado</span><span class="tag shark">Perdido</span><span class="tag">2026 · projetado</span>
</div>
<div class="row" style="margin-bottom:14px">
  <button class="chip" aria-pressed="true">30 dias</button><button class="chip" aria-pressed="false">90 dias</button><button class="chip" aria-pressed="false">12 meses</button>
  <span class="status" style="margin-left:12px"><i></i>Online agora</span>
</div>
<p class="note">Tag é informação (estilo <code>label</code>); chip é filtro (ativo em <code>flamingo-tint</code>); status é um ponto <code>success</code> com texto.</p>

</body>
</html>
